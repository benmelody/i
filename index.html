<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiệu Ứng Lấp Lánh 3D</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #03030c;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .ui-overlay {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            pointer-events: none;
            letter-spacing: 2px;
            font-size: 14px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(100, 200, 255, 0.5);
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div class="ui-overlay">Di chuyển chuột hoặc nghiêng thiết bị để xoay</div>

    <!-- Nhúng thư viện Three.js từ CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // Khởi tạo Scene, Camera và Renderer
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 400;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Tạo hệ thống hạt lấp lánh (Particles)
        const particleCount = 1200;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const scales = new Float32Array(particleCount);

        for (let i = 0; i < particleCount * 3; i += 3) {
            // Phân bố các hạt theo hình cầu bán kính 250
            const u = Math.random();
            const v = Math.random();
            const theta = u * 2.0 * Math.PI;
            const phi = Math.acos(2.0 * v - 1.0);
            const r = 250 * Math.cbrt(Math.random());

            positions[i] = r * Math.sin(phi) * Math.cos(theta);
            positions[i + 1] = r * Math.sin(phi) * Math.sin(theta);
            positions[i + 2] = r * Math.cos(phi);

            scales[i / 3] = Math.random();
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        // Tạo Texture hình tròn mềm mại cho hạt sáng
        function createParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.3, 'rgba(100, 200, 255, 0.8)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            
            return new THREE.CanvasTexture(canvas);
        }

        const material = new THREE.PointsMaterial({
            size: 8,
            map: createParticleTexture(),
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);

        // Tạo các đường nối lấp lánh giữa các hạt gần nhau
        const lineMaterial = new THREE.LineBasicMaterial({
            color: 0x4488ff,
            transparent: true,
            opacity: 0.15,
            blending: THREE.AdditiveBlending
        });

        const lineGeometry = new THREE.BufferGeometry();
        const linesMesh = new THREE.LineSegments(lineGeometry, lineMaterial);
        scene.add(linesMesh);

        // Xử lý tương tác chuột và cảm biến thiết bị (Mobile)
        let mouseX = 0, mouseY = 0;
        let targetX = 0, targetY = 0;
        let windowHalfX = window.innerWidth / 2;
        let windowHalfY = window.innerHeight / 2;

        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX - windowHalfX);
            mouseY = (event.clientY - windowHalfY);
        });

        // Hỗ trợ cảm biến xoay trên điện thoại
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (event) => {
                if (event.gamma !== null && event.beta !== null) {
                    mouseX = event.gamma * 10;
                    mouseY = event.beta * 10;
                }
            });
        }

        window.addEventListener('resize', () => {
            windowHalfX = window.innerWidth / 2;
            windowHalfY = window.innerHeight / 2;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Vòng lặp chuyển động mượt mà (Animation Loop)
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // Hiệu ứng dịch chuyển camera mượt theo vị trí chuột
            targetX = mouseX * 0.001;
            targetY = mouseY * 0.001;

            particleSystem.rotation.y += 0.002 + (targetX - particleSystem.rotation.y) * 0.05;
            particleSystem.rotation.x += 0.001 + (targetY - particleSystem.rotation.x) * 0.05;
            
            linesMesh.rotation.y = particleSystem.rotation.y;
            linesMesh.rotation.x = particleSystem.rotation.x;

            // Hiệu ứng lấp lánh động thay đổi kích thước hạt theo thời gian
            const positionsAttr = geometry.attributes.position;
            const count = positionsAttr.count;
            
            // Cập nhật các đường nối ngẫu nhiên dựa trên khoảng cách
            const linePositions = [];
            const posArray = positionsAttr.array;
            
            // Xoay nhẹ các điểm để tạo cảm giác sống động
            for(let i = 0; i < count; i++) {
                let x = posArray[i * 3];
                let y = posArray[i * 3 + 1];
                let z = posArray[i * 3 + 2];
                
                // Hiệu ứng thở nhẹ cho khối hình
                // (Có thể tùy chỉnh thêm nếu muốn các hạt bơi lội độc lập)
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
