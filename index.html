<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiệu Ứng Sợi Dây Ánh Sáng Chạy 3D</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #010104;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .ui-overlay {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 245, 220, 0.9);
            text-align: center;
            pointer-events: none;
            letter-spacing: 2px;
            font-size: 13px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255, 210, 120, 0.8);
            z-index: 10;
            background: rgba(10, 8, 15, 0.7);
            padding: 10px 24px;
            border-radius: 20px;
            border: 1px solid rgba(255, 210, 120, 0.3);
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div class="ui-overlay">Kéo để xoay • Chạm đổi hình (Ánh sáng chạy) • Zoom gần xa</div>

    <!-- Thư viện Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 400;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const pointsPerStrand = 300;
        const strandCount = 12;

        function generateStrands(shapeType) {
            const allStrands = [];
            for (let s = 0; s < strandCount; s++) {
                const strandPoints = [];
                const offsetAngle = (s / strandCount) * Math.PI * 2;

                for (let i = 0; i < pointsPerStrand; i++) {
                    const progress = i / pointsPerStrand;
                    let x = 0, y = 0, z = 0;

                    if (shapeType === 'helix') {
                        const turns = 4;
                        const height = 280;
                        const radius = 90;
                        const t = progress * Math.PI * 2 * turns + offsetAngle;
                        const isSecond = (s % 2 === 0);
                        const r = isSecond ? radius : -radius;
                        x = r * Math.cos(t);
                        y = (progress * height) - (height / 2);
                        z = r * Math.sin(t);
                    } else if (shapeType === 'lissajous') {
                        const t = progress * Math.PI * 4 + offsetAngle;
                        const scale = 120;
                        x = scale * Math.sin(3 * t + Math.PI / 4);
                        y = scale * Math.sin(2 * t);
                        z = scale * Math.cos(3 * t);
                    } else if (shapeType === 'heart') {
                        const t = progress * Math.PI * 2 + offsetAngle;
                        const hx = 16 * Math.pow(Math.sin(t), 3);
                        const hy = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                        const scale = 11;
                        x = hx * scale;
                        y = hy * scale;
                        z = (s - strandCount/2) * 6;
                    } else if (shapeType === 'torusKnot') {
                        const u = progress * Math.PI * 2 * 2 + offsetAngle;
                        const v = progress * Math.PI * 2 * 3;
                        const r = 90;
                        x = r * (1.2 + 0.4 * Math.cos(v)) * Math.cos(u);
                        y = r * (1.2 + 0.4 * Math.cos(v)) * Math.sin(u);
                        z = r * 0.4 * Math.sin(v);
                    } else if (shapeType === 'sphere') {
                        const theta = progress * Math.PI * 2 + offsetAngle;
                        const phi = progress * Math.PI;
                        const r = 150;
                        x = r * Math.sin(phi) * Math.cos(theta);
                        y = r * Math.sin(phi) * Math.sin(theta);
                        z = r * Math.cos(phi);
                    }

                    strandPoints.push(new THREE.Vector3(x, y, z));
                }
                allStrands.push(strandPoints);
            }
            return allStrands;
        }

        const shapeTypes = ['helix', 'lissajous', 'heart', 'torusKnot', 'sphere'];
        let currentShapeIdx = 0;

        const mainGroup = new THREE.Group();
        scene.add(mainGroup);

        let currentStrandsData = generateStrands(shapeTypes[0]);
        let targetStrandsData = generateStrands(shapeTypes[1]);

        // Tạo khung dải dây mờ ảo
        const lineMeshes = [];
        for (let s = 0; s < strandCount; s++) {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(pointsPerStrand * 3);
            for (let i = 0; i < pointsPerStrand; i++) {
                const pt = currentStrandsData[s][i];
                positions[i * 3] = pt.x;
                positions[i * 3 + 1] = pt.y;
                positions[i * 3 + 2] = pt.z;
            }
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const material = new THREE.LineBasicMaterial({
                color: 0xffe082,
                transparent: true,
                opacity: 0.35,
                blending: THREE.AdditiveBlending
            });
            const line = new THREE.Line(geometry, material);
            mainGroup.add(line);
            lineMeshes.push({ line, geometry, strandIndex: s });
        }

        // Tạo các hạt ánh sáng chạy dọc theo các sợi dây (Moving Sparkles)
        const particleCountPerStrand = 30;
        const totalParticles = strandCount * particleCountPerStrand;
        const particleGeo = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(totalParticles * 3);
        const particleProgress = new Float32Array(totalParticles);
        const particleStrandMap = new Int32Array(totalParticles);

        let pIdx = 0;
        for (let s = 0; s < strandCount; s++) {
            for (let p = 0; p < particleCountPerStrand; p++) {
                particleProgress[pIdx] = Math.random();
                particleStrandMap[pIdx] = s;
                pIdx++;
            }
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));

        function createParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.3, 'rgba(255, 240, 200, 0.95)');
            gradient.addColorStop(0.7, 'rgba(255, 180, 50, 0.3)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        const particleMat = new THREE.PointsMaterial({
            size: 8,
            map: createParticleTexture(),
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particleSystem = new THREE.Points(particleGeo, particleMat);
        mainGroup.add(particleSystem);

        let isMorphing = false;
        let morphProgress = 1.0;

        // Tương tác
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let rotationVelocityX = 0;
        let rotationVelocityY = 0;
        let clickStartTime = 0;
        let startX = 0, startY = 0;

        window.addEventListener('pointerdown', (e) => {
            if (e.pointerType === 'touch' && event.touches && event.touches.length > 1) return;
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
            clickStartTime = Date.now();
            startX = e.clientX;
            startY = e.clientY;
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;

            mainGroup.rotation.y += deltaX * 0.008;
            mainGroup.rotation.x += deltaY * 0.008;
            rotationVelocityY = deltaX * 0.008;
            rotationVelocityX = deltaY * 0.008;

            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointerup', (e) => {
            isDragging = false;
            const dist = Math.hypot(e.clientX - startX, e.clientY - startY);
            const duration = Date.now() - clickStartTime;

            if (dist < 10 && duration < 350) {
                currentShapeIdx = (currentShapeIdx + 1) % shapeTypes.length;
                currentStrandsData = JSON.parse(JSON.stringify(targetStrandsData));
                targetStrandsData = generateStrands(shapeTypes[currentShapeIdx]);
                morphProgress = 0.0;
                isMorphing = true;
            }
        });

        window.addEventListener('wheel', (e) => {
            camera.position.z += e.deltaY * 0.4;
            camera.position.z = Math.max(150, Math.min(750, camera.position.z));
        }, { passive: true });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);

            // Xử lý chuyển đổi hình dáng mượt mà
            if (isMorphing) {
                morphProgress += 0.04;
                if (morphProgress >= 1.0) {
                    morphProgress = 1.0;
                    isMorphing = false;
                    currentStrandsData = JSON.parse(JSON.stringify(targetStrandsData));
                }

                for (let m = 0; m < lineMeshes.length; m++) {
                    const { geometry, strandIndex } = lineMeshes[m];
                    const posAttr = geometry.attributes.position;
                    const arr = posAttr.array;

                    for (let i = 0; i < pointsPerStrand; i++) {
                        const startPt = currentStrandsData[strandIndex][i];
                        const targetPt = targetStrandsData[strandIndex][i];

                        arr[i * 3]     = startPt.x + (targetPt.x - startPt.x) * morphProgress;
                        arr[i * 3 + 1] = startPt.y + (targetPt.y - startPt.y) * morphProgress;
                        arr[i * 3 + 2] = startPt.z + (targetPt.z - startPt.z) * morphProgress;
                    }
                    posAttr.needsUpdate = true;
                }
            }

            // Cập nhật các hạt ánh sáng trượt dọc theo các sợi dây
            const pPositions = particleGeo.attributes.position.array;
            for (let i = 0; i < totalParticles; i++) {
                particleProgress[i] += 0.006; // Tốc độ chạy của ánh sáng
                if (particleProgress[i] > 1.0) particleProgress[i] = 0.0;

                const s = particleStrandMap[i];
                const strand = currentStrandsData[s];
                const indexFloat = particleProgress[i] * (pointsPerStrand - 1);
                const index1 = Math.floor(indexFloat);
                const index2 = Math.min(index1 + 1, pointsPerStrand - 1);
                const weight = indexFloat - index1;

                const pt1 = strand[index1];
                const pt2 = strand[index2];

                pPositions[i * 3]     = pt1.x + (pt2.x - pt1.x) * weight;
                pPositions[i * 3 + 1] = pt1.y + (pt2.y - pt1.y) * weight;
                pPositions[i * 3 + 2] = pt1.z + (pt2.z - pt1.z) * weight;
            }
            particleGeo.attributes.position.needsUpdate = true;

            // Đứng yên hoàn toàn khi không kéo xoay
            if (!isDragging) {
                rotationVelocityX *= 0.85;
                rotationVelocityY *= 0.85;
                mainGroup.rotation.x += rotationVelocityX;
                mainGroup.rotation.y += rotationVelocityY;
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
