<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiệu Ứng Phép Thuật Ánh Đèn 3D</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #010104;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .ui-overlay {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 245, 220, 0.9);
            text-align: center;
            pointer-events: none;
            letter-spacing: 2px;
            font-size: 13px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255, 210, 120, 0.8);
            z-index: 10;
            background: rgba(10, 8, 15, 0.7);
            padding: 10px 24px;
            border-radius: 20px;
            border: 1px solid rgba(255, 210, 120, 0.3);
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div class="ui-overlay">Chạm để niệm phép đổi hình • Kéo để xoay • Zoom gần xa</div>

    <!-- Thư viện Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 400;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const particleCount = 3200;
        const geometry = new THREE.BufferGeometry();

        // Các hình dạng quỹ đạo phép thuật
        function generateDualHelixPositions(count) {
            const pos = new Float32Array(count * 3);
            const turns = 5;
            const height = 280;
            const radius = 100;
            for (let i = 0; i < count; i++) {
                const t = (i / count) * Math.PI * 2 * turns;
                const isSecond = (i % 2 === 0);
                const r = isSecond ? radius : -radius;
                pos[i * 3] = r * Math.cos(t) + (Math.random() - 0.5) * 6;
                pos[i * 3 + 1] = ((i / count) * height) - (height / 2) + (Math.random() - 0.5) * 6;
                pos[i * 3 + 2] = r * Math.sin(t) + (Math.random() - 0.5) * 6;
            }
            return pos;
        }

        function generateLissajousPositions(count) {
            const pos = new Float32Array(count * 3);
            for (let i = 0; i < count; i++) {
                const t = (i / count) * Math.PI * 4;
                const scale = 130;
                pos[i * 3] = scale * Math.sin(3 * t + Math.PI / 4) + (Math.random() - 0.5) * 6;
                pos[i * 3 + 1] = scale * Math.sin(2 * t) + (Math.random() - 0.5) * 6;
                pos[i * 3 + 2] = scale * Math.cos(3 * t) + (Math.random() - 0.5) * 6;
            }
            return pos;
        }

        function generateHeartPositions(count) {
            const pos = new Float32Array(count * 3);
            for (let i = 0; i < count; i++) {
                const t = (i / count) * Math.PI * 2;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                const scale = 12;
                pos[i * 3] = x * scale + (Math.random() - 0.5) * 8;
                pos[i * 3 + 1] = y * scale + (Math.random() - 0.5) * 8;
                pos[i * 3 + 2] = (Math.random() - 0.5) * 50;
            }
            return pos;
        }

        function generateTorusKnotPositions(count) {
            const pos = new Float32Array(count * 3);
            for (let i = 0; i < count; i++) {
                const u = (i / count) * Math.PI * 2 * 2;
                const v = (i / count) * Math.PI * 2 * 3;
                const r = 100;
                pos[i * 3] = r * (1.2 + 0.4 * Math.cos(v)) * Math.cos(u) + (Math.random() - 0.5) * 6;
                pos[i * 3 + 1] = r * (1.2 + 0.4 * Math.cos(v)) * Math.sin(u) + (Math.random() - 0.5) * 6;
                pos[i * 3 + 2] = r * 0.4 * Math.sin(v) + (Math.random() - 0.5) * 6;
            }
            return pos;
        }

        function generateMagicSpherePositions(count) {
            const pos = new Float32Array(count * 3);
            for (let i = 0; i < count * 3; i += 3) {
                const u = Math.random();
                const v = Math.random();
                const theta = u * 2.0 * Math.PI;
                const phi = Math.acos(2.0 * v - 1.0);
                const r = 160 * Math.cbrt(Math.random());
                pos[i] = r * Math.sin(phi) * Math.cos(theta);
                pos[i + 1] = r * Math.sin(phi) * Math.sin(theta);
                pos[i + 2] = r * Math.cos(phi);
            }
            return pos;
        }

        const shapes = [
            generateDualHelixPositions(particleCount),
            generateLissajousPositions(particleCount),
            generateHeartPositions(particleCount),
            generateTorusKnotPositions(particleCount),
            generateMagicSpherePositions(particleCount)
        ];

        let currentShapeIndex = 0;
        const currentPositions = new Float32Array(shapes[0]);
        const targetPositions = new Float32Array(shapes[0]);
        // Lưu trữ độ dịch chuyển bùng nổ phép thuật cho từng hạt
        const burstOffsets = new Float32Array(particleCount * 3);

        geometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));

        // Phối màu ánh đèn phép thuật (Trắng tinh khiết, Vàng ấm, Vàng kem)
        const colors = new Float32Array(particleCount * 3);
        const colorPalette = [
            new THREE.Color(0xffffff),
            new THREE.Color(0xfff6e0),
            new THREE.Color(0xffe082),
            new THREE.Color(0xffd54f)
        ];

        for (let i = 0; i < particleCount; i++) {
            const col = colorPalette[Math.floor(Math.random() * colorPalette.length)];
            colors[i * 3] = col.r;
            colors[i * 3 + 1] = col.g;
            colors[i * 3 + 2] = col.b;
        }
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        function createParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.3, 'rgba(255, 240, 200, 0.95)');
            gradient.addColorStop(0.7, 'rgba(255, 210, 120, 0.4)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            
            return new THREE.CanvasTexture(canvas);
        }

        const material = new THREE.PointsMaterial({
            size: 8,
            vertexColors: true,
            map: createParticleTexture(),
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);

        // Biến tương tác
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let rotationVelocityX = 0;
        let rotationVelocityY = 0;

        let clickStartTime = 0;
        let startX = 0, startY = 0;
        let flashProgress = 0;

        window.addEventListener('pointerdown', (e) => {
            if (e.pointerType === 'touch' && event.touches && event.touches.length > 1) return;
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
            clickStartTime = Date.now();
            startX = e.clientX;
            startY = e.clientY;
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;

            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;

            particleSystem.rotation.y += deltaX * 0.008;
            particleSystem.rotation.x += deltaY * 0.008;

            rotationVelocityY = deltaX * 0.008;
            rotationVelocityX = deltaY * 0.008;

            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointerup', (e) => {
            isDragging = false;
            const dist = Math.hypot(e.clientX - startX, e.clientY - startY);
            const duration = Date.now() - clickStartTime;

            // Click/tap nhanh: Kích hoạt phép thuật đổi hình & bùng nổ hạt
            if (dist < 10 && duration < 350) {
                currentShapeIndex = (currentShapeIndex + 1) % shapes.length;
                const nextShape = shapes[currentShapeIndex];
                for (let i = 0; i < targetPositions.length; i++) {
                    targetPositions[i] = nextShape[i];
                    // Tạo một lực đẩy ngẫu nhiên hướng ra ngoài như vụ nổ phép thuật
                    burstOffsets[i] = (Math.random() - 0.5) * 180;
                }
                flashProgress = 1.0;
            }
        });

        // Zoom bằng lăn chuột
        window.addEventListener('wheel', (e) => {
            camera.position.z += e.deltaY * 0.4;
            camera.position.z = Math.max(150, Math.min(750, camera.position.z));
        }, { passive: true });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const posAttr = geometry.attributes.position;
            const posArr = posAttr.array;
            let needsUpdate = false;

            // Hiệu ứng biến hình kết hợp lực bùng nổ phép thuật
            for (let i = 0; i < posArr.length; i++) {
                // Giảm dần độ lệch bùng nổ theo thời gian để hạt tự động hút về hình dáng chính xác
                burstOffsets[i] *= 0.92;

                const targetWithBurst = targetPositions[i] + burstOffsets[i];
                const diff = targetWithBurst - posArr[i];
                if (Math.abs(diff) > 0.01) {
                    posArr[i] += diff * 0.08;
                    needsUpdate = true;
                }
            }
            if (needsUpdate) {
                posAttr.needsUpdate = true;
            }

            if (flashProgress > 0) {
                flashProgress -= 0.03;
                if (flashProgress < 0) flashProgress = 0;
            }

            // Đứng yên hoàn toàn khi không chạm/không kéo
            if (!isDragging) {
                rotationVelocityX *= 0.82;
                rotationVelocityY *= 0.82;
                particleSystem.rotation.x += rotationVelocityX;
                particleSystem.rotation.y += rotationVelocityY;
            }

            // Hiệu ứng hạt lóe sáng mạnh mẽ mỗi khi niệm phép đổi hình
            const elapsedTime = clock.getElapsedTime();
            material.size = 8 + (flashProgress * 14) + Math.sin(elapsedTime * 6) * 1.5;

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
