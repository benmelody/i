<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiệu Ứng Sợi Dây Ánh Sáng 3D - Magic Lines</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #010104;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .ui-overlay {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 245, 220, 0.9);
            text-align: center;
            pointer-events: none;
            letter-spacing: 2px;
            font-size: 13px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255, 210, 120, 0.8);
            z-index: 10;
            background: rgba(10, 8, 15, 0.7);
            padding: 10px 24px;
            border-radius: 20px;
            border: 1px solid rgba(255, 210, 120, 0.3);
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div class="ui-overlay">Kéo để xoay • Chạm đổi hình (Sợi dây sáng) • Zoom gần xa</div>

    <!-- Thư viện Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 400;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Tạo các hình dạng bằng DẢI ĐƯỜNG DÂY LIÊN TỤC (Lines)
        const pointsPerStrand = 350;
        const strandCount = 14; // Số lượng sợi dây quấn quýt

        function generateStrands(shapeType) {
            const allStrands = [];
            for (let s = 0; s < strandCount; s++) {
                const strandPoints = [];
                const offsetAngle = (s / strandCount) * Math.PI * 2;

                for (let i = 0; i < pointsPerStrand; i++) {
                    const progress = i / pointsPerStrand;
                    let x = 0, y = 0, z = 0;

                    if (shapeType === 'helix') {
                        // Vòng xoắn kép (Dual Helix đúng chuẩn video TikTok)
                        const turns = 4;
                        const height = 280;
                        const radius = 90;
                        const t = progress * Math.PI * 2 * turns + offsetAngle;
                        const isSecond = (s % 2 === 0);
                        const r = isSecond ? radius : -radius;
                        x = r * Math.cos(t);
                        y = (progress * height) - (height / 2);
                        z = r * Math.sin(t);
                    } else if (shapeType === 'lissajous') {
                        // Nút thắt không gian
                        const t = progress * Math.PI * 4 + offsetAngle;
                        const scale = 120;
                        x = scale * Math.sin(3 * t + Math.PI / 4);
                        y = scale * Math.sin(2 * t);
                        z = scale * Math.cos(3 * t);
                    } else if (shapeType === 'heart') {
                        // Trái tim lụa sáng
                        const t = progress * Math.PI * 2 + offsetAngle;
                        const hx = 16 * Math.pow(Math.sin(t), 3);
                        const hy = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                        const scale = 11;
                        x = hx * scale;
                        y = hy * scale;
                        z = (s - strandCount/2) * 6;
                    } else if (shapeType === 'torusKnot') {
                        // Vòng xoắn ốc lò xo
                        const u = progress * Math.PI * 2 * 2 + offsetAngle;
                        const v = progress * Math.PI * 2 * 3;
                        const r = 90;
                        x = r * (1.2 + 0.4 * Math.cos(v)) * Math.cos(u);
                        y = r * (1.2 + 0.4 * Math.cos(v)) * Math.sin(u);
                        z = r * 0.4 * Math.sin(v);
                    } else if (shapeType === 'sphere') {
                        // Quả cầu ánh sáng
                        const theta = progress * Math.PI * 2 + offsetAngle;
                        const phi = progress * Math.PI;
                        const r = 150;
                        x = r * Math.sin(phi) * Math.cos(theta);
                        y = r * Math.sin(phi) * Math.sin(theta);
                        z = r * Math.cos(phi);
                    }

                    strandPoints.push(new THREE.Vector3(x, y, z));
                }
                allStrands.push(strandPoints);
            }
            return allStrands;
        }

        const shapeTypes = ['helix', 'lissajous', 'heart', 'torusKnot', 'sphere'];
        let currentShapeIdx = 0;

        const lineGroup = new THREE.Group();
        scene.add(lineGroup);

        let currentStrandsData = generateStrands(shapeTypes[0]);
        let targetStrandsData = generateStrands(shapeTypes[1]);
        const lineMeshes = [];

        function buildLines() {
            while(lineGroup.children.length > 0){ 
                lineGroup.remove(lineGroup.children[0]); 
            }
            lineMeshes.length = 0;

            for (let s = 0; s < strandCount; s++) {
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(pointsPerStrand * 3);
                
                for (let i = 0; i < pointsPerStrand; i++) {
                    const pt = currentStrandsData[s][i];
                    positions[i * 3] = pt.x;
                    positions[i * 3 + 1] = pt.y;
                    positions[i * 3 + 2] = pt.z;
                }
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

                // Chất liệu sợi dây ánh sáng ấm áp
                const material = new THREE.LineBasicMaterial({
                    color: s % 2 === 0 ? 0xfff5e6 : 0xffd54f,
                    transparent: true,
                    opacity: 0.85,
                    blending: THREE.AdditiveBlending
                });

                const line = new THREE.Line(geometry, material);
                lineGroup.add(line);
                lineMeshes.push({ line, geometry, strandIndex: s });
            }
        }

        buildLines();

        let isMorphing = false;
        let morphProgress = 1.0;

        // Tương tác kéo xoay & click đổi hình
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let rotationVelocityX = 0;
        let rotationVelocityY = 0;
        let clickStartTime = 0;
        let startX = 0, startY = 0;

        window.addEventListener('pointerdown', (e) => {
            if (e.pointerType === 'touch' && event.touches && event.touches.length > 1) return;
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
            clickStartTime = Date.now();
            startX = e.clientX;
            startY = e.clientY;
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;

            lineGroup.rotation.y += deltaX * 0.008;
            lineGroup.rotation.x += deltaY * 0.008;
            rotationVelocityY = deltaX * 0.008;
            rotationVelocityX = deltaY * 0.008;

            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointerup', (e) => {
            isDragging = false;
            const dist = Math.hypot(e.clientX - startX, e.clientY - startY);
            const duration = Date.now() - clickStartTime;

            if (dist < 10 && duration < 350) {
                currentShapeIdx = (currentShapeIdx + 1) % shapeTypes.length;
                currentStrandsData = JSON.parse(JSON.stringify(targetStrandsData));
                targetStrandsData = generateStrands(shapeTypes[currentShapeIdx]);
                morphProgress = 0.0;
                isMorphing = true;
            }
        });

        // Zoom bằng lăn chuột
        window.addEventListener('wheel', (e) => {
            camera.position.z += e.deltaY * 0.4;
            camera.position.z = Math.max(150, Math.min(750, camera.position.z));
        }, { passive: true });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);

            // Hiệu ứng biến hình mượt mà giữa các sợi dây
            if (isMorphing) {
                morphProgress += 0.04;
                if (morphProgress >= 1.0) {
                    morphProgress = 1.0;
                    isMorphing = false;
                    currentStrandsData = JSON.parse(JSON.stringify(targetStrandsData));
                }

                for (let m = 0; m < lineMeshes.length; m++) {
                    const { geometry, strandIndex } = lineMeshes[m];
                    const posAttr = geometry.attributes.position;
                    const arr = posAttr.array;

                    for (let i = 0; i < pointsPerStrand; i++) {
                        const startPt = currentStrandsData[strandIndex][i];
                        const targetPt = targetStrandsData[strandIndex][i];

                        arr[i * 3]     = startPt.x + (targetPt.x - startPt.x) * morphProgress;
                        arr[i * 3 + 1] = startPt.y + (targetPt.y - startPt.y) * morphProgress;
                        arr[i * 3 + 2] = startPt.z + (targetPt.z - startPt.z) * morphProgress;
                    }
                    posAttr.needsUpdate = true;
                }
            }

            // Đứng yên hoàn toàn khi không kéo xoay
            if (!isDragging) {
                rotationVelocityX *= 0.85;
                rotationVelocityY *= 0.85;
                lineGroup.rotation.x += rotationVelocityX;
                lineGroup.rotation.y += rotationVelocityY;
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
