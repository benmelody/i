<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiệu Ứng Pháo Hoa Hạt 3D - Tương Tác & Zoom</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030205;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .ui-overlay {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 230, 150, 0.85);
            text-align: center;
            pointer-events: none;
            letter-spacing: 1.5px;
            font-size: 13px;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(255, 180, 50, 0.7);
            z-index: 10;
            background: rgba(10, 5, 2, 0.6);
            padding: 10px 22px;
            border-radius: 20px;
            border: 1px solid rgba(255, 200, 100, 0.2);
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div class="ui-overlay">Chạm đổi hình • Kéo xoay • Lăn chuột/Pinch để Zoom</div>

    <!-- Thư viện Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 400;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const particleCount = 2500;
        const geometry = new THREE.BufferGeometry();

        // 1. Hình Cầu Pháo Hoa
        function generateSpherePositions(count) {
            const pos = new Float32Array(count * 3);
            for (let i = 0; i < count * 3; i += 3) {
                const u = Math.random();
                const v = Math.random();
                const theta = u * 2.0 * Math.PI;
                const phi = Math.acos(2.0 * v - 1.0);
                const r = 180 * Math.cbrt(Math.random());
                pos[i] = r * Math.sin(phi) * Math.cos(theta);
                pos[i + 1] = r * Math.sin(phi) * Math.sin(theta);
                pos[i + 2] = r * Math.cos(phi);
            }
            return pos;
        }

        // 2. Trái Tim Vàng
        function generateHeartPositions(count) {
            const pos = new Float32Array(count * 3);
            for (let i = 0; i < count * 3; i += 3) {
                const t = Math.random() * Math.PI * 2;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                const z = (Math.random() - 0.5) * 40;
                
                const scale = 11;
                pos[i] = x * scale + (Math.random() - 0.5) * 12;
                pos[i + 1] = y * scale + (Math.random() - 0.5) * 12;
                pos[i + 2] = z + (Math.random() - 0.5) * 12;
            }
            return pos;
        }

        // 3. Sao Thổ & Vành Đai
        function generateSaturnPositions(count) {
            const pos = new Float32Array(count * 3);
            const ringCount = Math.floor(count * 0.7);
            const sphereCount = count - ringCount;

            let idx = 0;
            for (let i = 0; i < sphereCount; i++) {
                const u = Math.random();
                const v = Math.random();
                const theta = u * 2.0 * Math.PI;
                const phi = Math.acos(2.0 * v - 1.0);
                const r = 75 * Math.cbrt(Math.random());
                pos[idx] = r * Math.sin(phi) * Math.cos(theta);
                pos[idx + 1] = r * Math.sin(phi) * Math.sin(theta);
                pos[idx + 2] = r * Math.cos(phi);
                idx += 3;
            }
            for (let i = 0; i < ringCount; i++) {
                const r = 110 + Math.random() * 120;
                const theta = Math.random() * Math.PI * 2;
                pos[idx] = r * Math.cos(theta);
                pos[idx + 1] = (Math.random() - 0.5) * 8;
                pos[idx + 2] = r * Math.sin(theta);
                idx += 3;
            }
            return pos;
        }

        // 4. Dải Ngân Hà
        function generateGalaxyPositions(count) {
            const pos = new Float32Array(count * 3);
            const arms = 3;
            for (let i = 0; i < count * 3; i += 3) {
                const r = Math.random() * 210;
                const arm = (i / 3) % arms;
                const theta = (arm * 2 * Math.PI / arms) + (r * 0.005) + (Math.random() - 0.5) * 0.25;
                
                pos[i] = r * Math.cos(theta);
                pos[i + 1] = (Math.random() - 0.5) * 25 * (1 - r/210);
                pos[i + 2] = r * Math.sin(theta);
            }
            return pos;
        }

        // 5. Vòng Xoắn Kép DNA
        function generateDoubleHelixPositions(count) {
            const pos = new Float32Array(count * 3);
            const turns = 4;
            const height = 260;
            const radius = 80;
            
            for (let i = 0; i < count; i++) {
                const isSecondHelix = (i % 2 === 0);
                const angle = (i / count) * Math.PI * 2 * turns;
                const y = ((i / count) * height) - (height / 2);
                const r = isSecondHelix ? radius : -radius;
                
                pos[i * 3] = r * Math.cos(angle) + (Math.random() - 0.5) * 10;
                pos[i * 3 + 1] = y + (Math.random() - 0.5) * 10;
                pos[i * 3 + 2] = r * Math.sin(angle) + (Math.random() - 0.5) * 10;
            }
            return pos;
        }

        // 6. Nút Thắt Không Gian (Torus Knot)
        function generateTorusKnotPositions(count) {
            const pos = new Float32Array(count * 3);
            for (let i = 0; i < count; i++) {
                const u = (i / count) * Math.PI * 2 * 2;
                const v = (i / count) * Math.PI * 2 * 3;
                const r = 90;
                const x = r * (1.2 + 0.4 * Math.cos(v)) * Math.cos(u);
                const y = r * (1.2 + 0.4 * Math.cos(v)) * Math.sin(u);
                const z = r * 0.4 * Math.sin(v);
                
                pos[i * 3] = x + (Math.random() - 0.5) * 10;
                pos[i * 3 + 1] = y + (Math.random() - 0.5) * 10;
                pos[i * 3 + 2] = z + (Math.random() - 0.5) * 10;
            }
            return pos;
        }

        // 7. Cầu Pháo Hoa Tỏa Sáng Mạnh
        function generateFireworkPositions(count) {
            const pos = new Float32Array(count * 3);
            for (let i = 0; i < count * 3; i += 3) {
                const u = Math.random();
                const v = Math.random();
                const theta = u * 2.0 * Math.PI;
                const phi = Math.acos(2.0 * v - 1.0);
                const r = 200 * Math.pow(Math.random(), 0.4);
                pos[i] = r * Math.sin(phi) * Math.cos(theta);
                pos[i + 1] = r * Math.sin(phi) * Math.sin(theta);
                pos[i + 2] = r * Math.cos(phi);
            }
            return pos;
        }

        const shapes = [
            generateSpherePositions(particleCount),
            generateHeartPositions(particleCount),
            generateSaturnPositions(particleCount),
            generateGalaxyPositions(particleCount),
            generateDoubleHelixPositions(particleCount),
            generateTorusKnotPositions(particleCount),
            generateFireworkPositions(particleCount)
        ];

        let currentShapeIndex = 0;
        const currentPositions = new Float32Array(shapes[0]);
        const targetPositions = new Float32Array(shapes[0]);

        geometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));

        // Tạo Texture màu Vàng Pháo Hoa
        function createParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.25, 'rgba(255, 225, 100, 0.95)');
            gradient.addColorStop(0.6, 'rgba(255, 140, 20, 0.45)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            
            return new THREE.CanvasTexture(canvas);
        }

        const material = new THREE.PointsMaterial({
            size: 9,
            map: createParticleTexture(),
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);

        // Biến điều khiển tương tác (Xoay & Zoom)
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let rotationVelocityX = 0;
        let rotationVelocityY = 0;

        let clickStartTime = 0;
        let startX = 0, startY = 0;

        // Xử lý sự kiện chuột / chạm (Pointer Events)
        window.addEventListener('pointerdown', (e) => {
            if (e.pointerType === 'touch' && event.touches && event.touches.length > 1) return;
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
            clickStartTime = Date.now();
            startX = e.clientX;
            startY = e.clientY;
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;

            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;

            particleSystem.rotation.y += deltaX * 0.008;
            particleSystem.rotation.x += deltaY * 0.008;

            rotationVelocityY = deltaX * 0.008;
            rotationVelocityX = deltaY * 0.008;

            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointerup', (e) => {
            isDragging = false;
            const dist = Math.hypot(e.clientX - startX, e.clientY - startY);
            const duration = Date.now() - clickStartTime;

            // Click/tap nhanh để đổi hình
            if (dist < 10 && duration < 350) {
                currentShapeIndex = (currentShapeIndex + 1) % shapes.length;
                const nextShape = shapes[currentShapeIndex];
                for (let i = 0; i < targetPositions.length; i++) {
                    targetPositions[i] = nextShape[i];
                }
            }
        });

        // --- TÍNH NĂNG ZOOM ---
        // 1. Zoom bằng lăn chuột (Desktop)
        window.addEventListener('wheel', (e) => {
            camera.position.z += e.deltaY * 0.4;
            camera.position.z = Math.max(150, Math.min(750, camera.position.z)); // Giới hạn khoảng cách zoom
        }, { passive: true });

        // 2. Zoom bằng 2 ngón tay (Mobile Pinch-to-Zoom)
        let initialPinchDistance = 0;
        let initialCameraZ = 400;

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                isDragging = false;
                initialPinchDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                initialCameraZ = camera.position.z;
            }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                const currentDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const factor = initialPinchDistance / currentDistance;
                camera.position.z = initialCameraZ * factor;
                camera.position.z = Math.max(150, Math.min(750, camera.position.z));
            }
        }, { passive: true });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const posAttr = geometry.attributes.position;
            const posArr = posAttr.array;
            let needsUpdate = false;

            for (let i = 0; i < posArr.length; i++) {
                const diff = targetPositions[i] - posArr[i];
                if (Math.abs(diff) > 0.01) {
                    posArr[i] += diff * 0.07;
                    needsUpdate = true;
                }
            }
            if (needsUpdate) {
                posAttr.needsUpdate = true;
            }

            if (!isDragging) {
                particleSystem.rotation.y += 0.003 + rotationVelocityY;
                particleSystem.rotation.x += rotationVelocityX;
                rotationVelocityY *= 0.93;
                rotationVelocityX *= 0.93;
            }

            const elapsedTime = clock.getElapsedTime();
            material.size = 9 + Math.sin(elapsedTime * 5) * 2;

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
