<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiệu Ứng Hạt 3D Tương Tác</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020208;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .ui-overlay {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.75);
            text-align: center;
            pointer-events: none;
            letter-spacing: 1.5px;
            font-size: 13px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(120, 200, 255, 0.6);
            z-index: 10;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div class="ui-overlay">Chạm/Click để đổi hình • Kéo vuốt để xoay</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 400;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const particleCount = 2200;
        const geometry = new THREE.BufferGeometry();

        // Định nghĩa các hình dạng 3D khác nhau để chuyển đổi
        function generateSpherePositions(count) {
            const pos = new Float32Array(count * 3);
            for (let i = 0; i < count * 3; i += 3) {
                const u = Math.random();
                const v = Math.random();
                const theta = u * 2.0 * Math.PI;
                const phi = Math.acos(2.0 * v - 1.0);
                const r = 180 * Math.cbrt(Math.random());
                pos[i] = r * Math.sin(phi) * Math.cos(theta);
                pos[i + 1] = r * Math.sin(phi) * Math.sin(theta);
                pos[i + 2] = r * Math.cos(phi);
            }
            return pos;
        }

        function generateHeartPositions(count) {
            const pos = new Float32Array(count * 3);
            for (let i = 0; i < count * 3; i += 3) {
                const t = Math.random() * Math.PI * 2;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                const z = (Math.random() - 0.5) * 40;
                
                const scale = 11;
                pos[i] = x * scale + (Math.random() - 0.5) * 12;
                pos[i + 1] = y * scale + (Math.random() - 0.5) * 12;
                pos[i + 2] = z + (Math.random() - 0.5) * 12;
            }
            return pos;
        }

        function generateSaturnPositions(count) {
            const pos = new Float32Array(count * 3);
            const ringCount = Math.floor(count * 0.7);
            const sphereCount = count - ringCount;

            let idx = 0;
            for (let i = 0; i < sphereCount; i++) {
                const u = Math.random();
                const v = Math.random();
                const theta = u * 2.0 * Math.PI;
                const phi = Math.acos(2.0 * v - 1.0);
                const r = 75 * Math.cbrt(Math.random());
                pos[idx] = r * Math.sin(phi) * Math.cos(theta);
                pos[idx + 1] = r * Math.sin(phi) * Math.sin(theta);
                pos[idx + 2] = r * Math.cos(phi);
                idx += 3;
            }
            for (let i = 0; i < ringCount; i++) {
                const r = 110 + Math.random() * 120;
                const theta = Math.random() * Math.PI * 2;
                pos[idx] = r * Math.cos(theta);
                pos[idx + 1] = (Math.random() - 0.5) * 8;
                pos[idx + 2] = r * Math.sin(theta);
                idx += 3;
            }
            return pos;
        }

        function generateGalaxyPositions(count) {
            const pos = new Float32Array(count * 3);
            const arms = 3;
            for (let i = 0; i < count * 3; i += 3) {
                const r = Math.random() * 210;
                const arm = (i / 3) % arms;
                const theta = (arm * 2 * Math.PI / arms) + (r * 0.005) + (Math.random() - 0.5) * 0.25;
                
                pos[i] = r * Math.cos(theta);
                pos[i + 1] = (Math.random() - 0.5) * 25 * (1 - r/210);
                pos[i + 2] = r * Math.sin(theta);
            }
            return pos;
        }

        const shapes = [
            generateSpherePositions(particleCount),
            generateHeartPositions(particleCount),
            generateSaturnPositions(particleCount),
            generateGalaxyPositions(particleCount)
        ];

        let currentShapeIndex = 0;
        const currentPositions = new Float32Array(shapes[0]);
        const targetPositions = new Float32Array(shapes[0]);

        geometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));

        // Tạo hiệu ứng lấp lánh (Particle Texture)
        function createParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.3, 'rgba(120, 200, 255, 0.9)');
            gradient.addColorStop(0.7, 'rgba(100, 100, 255, 0.3)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            
            return new THREE.CanvasTexture(canvas);
        }

        const material = new THREE.PointsMaterial({
            size: 8,
            map: createParticleTexture(),
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);

        // Biến điều khiển xoay khi kéo vuốt (Drag to rotate)
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let rotationVelocityX = 0;
        let rotationVelocityY = 0;

        let clickStartTime = 0;
        let startX = 0, startY = 0;

        window.addEventListener('pointerdown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
            clickStartTime = Date.now();
            startX = e.clientX;
            startY = e.clientY;
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;

            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;

            particleSystem.rotation.y += deltaX * 0.008;
            particleSystem.rotation.x += deltaY * 0.008;

            rotationVelocityY = deltaX * 0.008;
            rotationVelocityX = deltaY * 0.008;

            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointerup', (e) => {
            isDragging = false;
            const dist = Math.hypot(e.clientX - startX, e.clientY - startY);
            const duration = Date.now() - clickStartTime;

            // Nếu click/tap nhanh (không phải đang kéo xoay) -> Chuyển hình dạng tiếp theo
            if (dist < 10 && duration < 350) {
                currentShapeIndex = (currentShapeIndex + 1) % shapes.length;
                const nextShape = shapes[currentShapeIndex];
                for (let i = 0; i < targetPositions.length; i++) {
                    targetPositions[i] = nextShape[i];
                }
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            // Hiệu ứng chuyển đổi hình dáng mượt mà (Morphing)
            const posAttr = geometry.attributes.position;
            const posArr = posAttr.array;
            let needsUpdate = false;

            for (let i = 0; i < posArr.length; i++) {
                const diff = targetPositions[i] - posArr[i];
                if (Math.abs(diff) > 0.01) {
                    posArr[i] += diff * 0.07;
                    needsUpdate = true;
                }
            }
            if (needsUpdate) {
                posAttr.needsUpdate = true;
            }

            // Tự động xoay khi không kéo và giữ quán tính mượt
            if (!isDragging) {
                particleSystem.rotation.y += 0.003 + rotationVelocityY;
                particleSystem.rotation.x += rotationVelocityX;
                rotationVelocityY *= 0.93;
                rotationVelocityX *= 0.93;
            }

            // Hiệu ứng hạt nhấp nháy sống động
            const elapsedTime = clock.getElapsedTime();
            material.size = 8 + Math.sin(elapsedTime * 4) * 1.5;

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
